name: ARES CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - ".ares/**"
      - "ares-state/**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check ares tests
      - name: Unit tests
        run: pytest -q
