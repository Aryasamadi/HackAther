name: One-time authorized PR release

on:
  push:
    branches: ["phase-3/feature-parity"]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-authorized-release:
    if: contains(github.event.head_commit.message, '[merge-authorized]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the current ARES CI run
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 15 * 60 * 1000;
            let ciRun = null;
            while (Date.now() < deadline) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "ci.yml",
                branch: context.ref.replace("refs/heads/", ""),
                per_page: 20
              });
              ciRun = runs.data.workflow_runs.find((run) => run.head_sha === context.sha);
              if (ciRun && ciRun.status === "completed") {
                if (ciRun.conclusion !== "success") {
                  throw new Error("ARES CI did not pass for release commit " + context.sha);
                }
                core.info("ARES CI passed: " + ciRun.html_url);
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            throw new Error("Timed out waiting for ARES CI on " + context.sha);

      - name: Mark ready and merge both authorized PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function getPullRequest(number) {
              const result = await github.graphql(
                "query($owner: String!, $name: String!, $number: Int!) { repository(owner: $owner, name: $name) { pullRequest(number: $number) { id isDraft headRefOid baseRefName state } } }",
                { owner, name: repo, number }
              );
              const pr = result.repository?.pullRequest;
              if (!pr || pr.state !== "OPEN") {
                throw new Error("PR #" + number + " is not open");
              }
              return pr;
            }

            async function markReady(pr, number) {
              if (!pr.isDraft) return pr;
              const result = await github.graphql(
                "mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { id isDraft } } }",
                { id: pr.id }
              );
              if (result.markPullRequestReadyForReview.pullRequest.isDraft) {
                throw new Error("Could not mark PR #" + number + " ready");
              }
              return await getPullRequest(number);
            }

            const pr2 = await getPullRequest(2);
            if (pr2.baseRefName !== "phase-2/ares-core") {
              throw new Error("Unexpected PR #2 base: " + pr2.baseRefName);
            }
            if (pr2.headRefOid !== context.sha) {
              throw new Error("PR #2 head moved; expected " + context.sha + " but found " + pr2.headRefOid);
            }
            await markReady(pr2, 2);
            const merge2 = await github.rest.pulls.merge({
              owner, repo, pull_number: 2, merge_method: "squash", sha: pr2.headRefOid
            });
            if (!merge2.data.merged) throw new Error("PR #2 merge failed");
            core.info("PR #2 merged into phase-2/ares-core: " + merge2.data.sha);

            const pr1 = await getPullRequest(1);
            if (pr1.baseRefName !== "main") {
              throw new Error("Unexpected PR #1 base: " + pr1.baseRefName);
            }
            const ready1 = await markReady(pr1, 1);
            const merge1 = await github.rest.pulls.merge({
              owner, repo, pull_number: 1, merge_method: "squash", sha: ready1.headRefOid
            });
            if (!merge1.data.merged) throw new Error("PR #1 merge failed");
            core.info("PR #1 merged into main: " + merge1.data.sha);

            const main = await github.rest.repos.getBranch({ owner, repo, branch: "main" });
            core.setOutput("main_sha", main.data.commit.sha);

      - name: Remove temporary release workflow from all branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = ".github/workflows/one-time-authorized-pr-release.yml";
            for (const branch of ["main", "phase-2/ares-core", "phase-3/feature-parity"]) {
              try {
                const file = await github.rest.repos.getContent({
                  owner, repo, path, ref: branch
                });
                if (Array.isArray(file.data) || !file.data.sha) continue;
                await github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path,
                  sha: file.data.sha,
                  branch,
                  message: "chore: remove one-time authorized release workflow"
                });
                core.info("Removed temporary release workflow from " + branch);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

      - name: Start fresh ARES runtime on main
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ares-runtime.yml",
              ref: "main"
            });
            core.info("Dispatched ARES Telegram Runtime on main. HTTP status: " + result.status);
