name: ARES Telegram Runtime

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - ".ares/**"
      - "ares-state/**"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ares-runtime
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  actions: write

jobs:
  telegram-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      ARES_RUNTIME_MINUTES: "340"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout ARES
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stop previous ARES runtime on code deployment
        if: github.event_name == 'push'
        timeout-minutes: 2
        uses: actions/github-script@v7
        with:
          script: |
            const active = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ares-runtime.yml",
              status: "in_progress",
              per_page: 20
            });
            const previous = active.data.workflow_runs.filter((run) => run.id !== context.runId);
            for (const run of previous) {
              core.info(`Cancelling previous ARES run ${run.id} on ${run.head_branch}`);
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }
            for (const run of previous) {
              let completed = false;
              for (let attempt = 0; attempt < 30; attempt += 1) {
                const status = await github.rest.actions.getWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                if (status.data.status === "completed") {
                  completed = true;
                  break;
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
              }
              if (!completed) {
                throw new Error(`Previous ARES worker ${run.id} did not stop in time; refusing to launch a duplicate.`);
              }
            }

      - name: Locate previous runtime snapshot
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ares-runtime.yml",
              status: "completed",
              per_page: 20
            });
            const previous = runs.data.workflow_runs.find((run) => run.id !== context.runId);
            core.setOutput("run_id", previous ? String(previous.id) : "");

      - name: Restore encrypted Strix run snapshot
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ares-strix-state
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ares-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ARES and Strix
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify Docker runtime
        run: docker info

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing repository secret TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$ADMIN_ID" || (echo "Missing repository secret ADMIN_ID" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "GitHub Actions token is unavailable" && exit 1)

      - name: Run ARES Telegram interface
        run: python -m ares

      - name: Save encrypted Strix run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-strix-state
          path: ares-state/strix-runs.enc
          if-no-files-found: ignore
          retention-days: 30
