name: ARES Telegram Runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ares-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  telegram-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      ARES_RUNTIME_MINUTES: "340"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout ARES
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Locate previous runtime snapshot
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ares-runtime.yml",
              branch: context.ref.replace("refs/heads/", ""),
              status: "completed",
              per_page: 20
            });
            const previous = runs.data.workflow_runs.find((run) => run.id !== context.runId);
            core.setOutput("run_id", previous ? String(previous.id) : "");

      - name: Restore encrypted Strix run snapshot
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ares-strix-state
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ares-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ARES and Strix
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify Docker runtime
        run: docker info

      - name: Validate required configuration
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Missing repository secret TELEGRAM_BOT_TOKEN" && exit 1)
          test -n "$ADMIN_ID" || (echo "Missing repository secret ADMIN_ID" && exit 1)
          test -n "$GITHUB_TOKEN" || (echo "GitHub Actions token is unavailable" && exit 1)

      - name: Run ARES Telegram interface
        run: python -m ares

      - name: Save encrypted Strix run state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-strix-state
          path: ares-state/strix-runs.enc
          if-no-files-found: ignore
          retention-days: 30
